name: Build & Release APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v2.0.0)"
        default: "v2.0.0"
        required: false

permissions:
  contents: write

env:
  VERSION_NAME: "2.0.0"
  VERSION_CODE: "29887640"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          mkdir -p keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
          fi
          if [ ! -f keystore/release.jks ]; then
            echo "Generating release keystore..."
            keytool -genkeypair -alias opencodemob -keyalg RSA -keysize 2048 -validity 36500 \
              -keystore keystore/release.jks -storepass opencodemob -keypass opencodemob \
              -dname "CN=OpenCode Mobile, O=OpenCodeMob, C=RU"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          ./gradlew --no-daemon :app:assembleRelease --stacktrace \
            -PappVersionName="${{ env.VERSION_NAME }}" \
            -PappVersionCode="${{ env.VERSION_CODE }}"
          cp app/build/outputs/apk/release/app-release.apk "OpenCode-${{ env.VERSION_NAME }}.apk"

      - name: Print diagnosis on failure
        if: failure()
        run: |
          echo "=== LINT REPORTS ==="
          find . -name "*lint*" -type f -exec cat {} + || true
          echo "=== BUILD LOGS / REPORTS ==="
          find app/build/reports -type f -exec head -n 100 {} + || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenCode-${{ env.VERSION_NAME }}
          path: OpenCode-${{ env.VERSION_NAME }}.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.0.0') }}
          name: "OpenCode ${{ env.VERSION_NAME }}"
          body_path: docs/releases/v2.0.0.md
          files: OpenCode-${{ env.VERSION_NAME }}.apk
          make_latest: true
