name: Build APK

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EXPO_APP_VARIANT: production
      EXPO_ANDROID_PACKAGE: dev.opencode.mobile
      ANDROID_RELEASE_ABIS: arm64-v8a
      ANDROID_KEYSTORE_PASSWORD: "111111"
      ANDROID_KEY_ALIAS: opencode-dev
      ANDROID_KEY_PASSWORD: "111111"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - name: Install CMake and NDK
        run: |
          set -eo pipefail
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          for pkg in 'cmake;3.22.1' 'ndk;27.1.12297006'; do
            for attempt in 1 2 3; do
              if sdkmanager --install "$pkg" </dev/null; then
                break
              fi
              rm -rf "$SDK_ROOT/.temp"
              case "$pkg" in
                ndk\;*) rm -rf "$SDK_ROOT/ndk/27.1.12297006" ;;
              esac
              if [ "$attempt" -eq 3 ]; then
                echo "::error::Failed to install $pkg after 3 attempts"
                exit 1
              fi
              sleep $((attempt * 5))
            done
          done

      - name: Install dependencies
        run: npm ci

      - name: Static checks
        run: npm run test:ci:static

      - name: Build Android release
        run: npm run build:android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/dev.keystore

      - name: Verify APK signature
        run: |
          set -eo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Name APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "opencode-mob-${GITHUB_RUN_NUMBER}.apk"
          ls -lh "opencode-mob-${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: opencode-mob-apk
          path: opencode-mob-*.apk
          retention-days: 14

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          tag="client-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" "opencode-mob-${GITHUB_RUN_NUMBER}.apk" \
            --title "OpenCodeMob client $GITHUB_RUN_NUMBER" \
            --notes "Android client built from $GITHUB_SHA. Connects to an external OpenCode server; no bundled server, Zen account or free models." \
            --latest
